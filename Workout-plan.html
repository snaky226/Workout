<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Workout"/>
<meta name="theme-color" content="#0a0a0f"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Weekly Workout Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: #0a0a0f; font-family: 'Syne', sans-serif; overflow-x: hidden; color: #fff; }
  .day-card { cursor: pointer; transition: transform 0.18s cubic-bezier(.4,2,.6,1), border-color 0.2s; user-select: none; background: #111116; border: 1.5px solid #1e1e28; border-radius: 14px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 7px; min-height: 130px; position: relative; overflow: hidden; }
  .day-card:hover { transform: translateY(-4px) scale(1.02); }
  .day-card.active { transform: translateY(-6px) scale(1.03); }
  .day-label { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 2px; color: #444; }
  .day-tag { font-family: 'DM Mono', monospace; font-size: 8px; letter-spacing: 1.5px; padding: 2px 6px; border-radius: 4px; }
  .day-name { font-weight: 700; font-size: 10px; color: #777; text-align: center; line-height: 1.3; }
  .glow-bar { position: absolute; top: 0; left: 0; right: 0; height: 2px; border-radius: 14px 14px 0 0; }
  .exercise-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #ffffff0d; gap: 8px; }
  .exercise-row:last-child { border-bottom: none; }
  .panel { background: #111116; border-radius: 18px; padding: 24px 28px; position: relative; overflow: hidden; animation: slideUp 0.3s cubic-bezier(.4,2,.55,1) forwards; display: none; }
  .panel.visible { display: block; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  .close-btn { background: #ffffff12; border: none; color: #fff; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 20px; line-height: 1; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .close-btn:hover { background: #ffffff25; }
  .tip-box { border-radius: 10px; padding: 12px 16px; display: flex; gap: 10px; align-items: flex-start; }
  .sets-badge { font-family: 'DM Mono', monospace; font-size: 12px; padding: 4px 10px; border-radius: 6px; flex-shrink: 0; white-space: nowrap; }
  .empty-hint { text-align: center; padding: 36px 0; font-family: 'DM Mono', monospace; font-size: 12px; color: #2a2a2a; letter-spacing: 1px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .wbtn { font-family: 'DM Mono', monospace; font-size: 12px; padding: 10px 20px; border-radius: 10px; cursor: pointer; letter-spacing: 1px; white-space: nowrap; border-width: 1.5px; border-style: solid; transition: opacity 0.15s; }
  .wbtn:hover { opacity: 0.75; }
  @media (max-width: 600px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
    .panel { padding: 18px 16px; }
    .wbtn { font-size: 11px; padding: 8px 14px; }
  }
</style>
</head>
<body>

<div style="padding:40px 24px 20px;max-width:860px;margin:0 auto;">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
    <div style="font-size:clamp(24px,4vw,40px);font-weight:800;letter-spacing:-1px;">WEEKLY PLAN</div>
    <div style="font-family:'DM Mono',monospace;font-size:12px;color:#FF6B35;background:#FF6B3520;border:1px solid #FF6B3540;border-radius:6px;padding:4px 10px;letter-spacing:1px;">STRENGTH</div>
  </div>
  <div style="font-family:'DM Mono',monospace;font-size:12px;color:#444;letter-spacing:1px;">180cm &middot; 60kg &middot; 4 lifting days &middot; strength &amp; muscle growth</div>
</div>

<div style="max-width:860px;margin:0 auto;padding:0 24px 20px;">
  <div style="background:#111116;border:1.5px solid #1e1e28;border-radius:18px;padding:24px 28px;position:relative;overflow:hidden;">
    <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#FF6B35,#a78bfa,#00D4FF);border-radius:18px 18px 0 0;"></div>
    <div id="today-content"></div>
  </div>
</div>

<div style="max-width:860px;margin:0 auto 10px;padding:0 24px;">
  <div style="font-family:'DM Mono',monospace;font-size:10px;color:#252525;letter-spacing:2px;">-- FULL WEEK --</div>
</div>

<div style="max-width:860px;margin:0 auto;padding:0 24px;" class="grid" id="calendar"></div>

<div style="max-width:860px;margin:16px auto 0;padding:0 24px 48px;min-height:180px;" id="panel-container">
  <div class="empty-hint">tap a day to see your workout</div>
</div>

<div style="max-width:860px;margin:0 auto;padding:0 32px 32px;display:flex;gap:20px;flex-wrap:wrap;">
  <div style="display:flex;align-items:center;gap:8px;"><span>&#127947;</span><span style="font-family:'DM Mono',monospace;font-size:11px;color:#FF6B35;letter-spacing:1px;">GYM</span></div>
  <div style="display:flex;align-items:center;gap:8px;"><span>&#128564;</span><span style="font-family:'DM Mono',monospace;font-size:11px;color:#888;letter-spacing:1px;">REST</span></div>
  <div style="display:flex;align-items:center;gap:8px;"><div style="width:10px;height:10px;border-radius:2px;background:#4ade8022;border:1px solid #4ade8055;"></div><span style="font-family:'DM Mono',monospace;font-size:11px;color:#4ade80;letter-spacing:1px;">HOME GYM</span></div>
  <div style="display:flex;align-items:center;gap:8px;"><div style="width:10px;height:10px;border-radius:2px;background:#a78bfa22;border:1px solid #a78bfa55;"></div><span style="font-family:'DM Mono',monospace;font-size:11px;color:#a78bfa;letter-spacing:1px;">30-MIN ALT</span></div>
</div>

<script>
var days = [
  {
    day:"MON", label:"Monday", type:"gym", color:"#FF6B35", title:"Push Day",
    subtitle:"Chest / Shoulders / Triceps", tag:"GYM",
    exercises:[
      {name:"Bench Press", sets:"4 x 6-8", note:"Go heavy — main strength lift", weight:"40-50 kg"},
      {name:"Overhead Press", sets:"4 x 6-8", note:"Strict form, no leg drive", weight:"25-30 kg"},
      {name:"Incline DB Press", sets:"3 x 8-10", note:"Full range of motion", weight:"12-15 kg each"},
      {name:"Lateral Raises", sets:"4 x 12-15", note:"Slow and controlled", weight:"5-8 kg each"},
      {name:"Tricep Pushdowns", sets:"3 x 10-12", note:"", weight:"15-20 kg"}
    ],
    tip:"Progressive overload — add weight or 1 rep each week. Keep a log.",
    homegym:{title:"Home Gym Push", subtitle:"Bench · Dumbbells · Bioforce",
      exercises:[
        {name:"DB Bench Press", sets:"4 x 8-10", note:"Flat bench, full range", weight:"Up to 18 kg each"},
        {name:"DB Shoulder Press", sets:"4 x 8-10", note:"Seated or standing", weight:"10-16 kg each"},
        {name:"Bioforce Chest Fly", sets:"3 x 12-15", note:"Keep slight elbow bend, squeeze at top", weight:"8-12 kg equiv"},
        {name:"DB Lateral Raises", sets:"4 x 12-15", note:"Slow and controlled", weight:"5-8 kg each"},
        {name:"Bioforce Tricep Pushdown", sets:"3 x 12-15", note:"Elbows pinned to sides", weight:"10-15 kg equiv"}
      ],
      tip:"DB bench with 18 kg each is solid. When it gets easy, slow the tempo — 3s down, 1s up — before going heavier."
    },
    alt:{title:"30-Min Home Push", subtitle:"No equipment needed",
      exercises:[
        {name:"Push-ups", sets:"4 x 15-20", note:"Wide grip for chest"},
        {name:"Pike Push-ups", sets:"3 x 10-12", note:"Targets shoulders"},
        {name:"Diamond Push-ups", sets:"3 x 10", note:"Hits triceps hard"},
        {name:"Chair Dips", sets:"3 x 15", note:"Use any sturdy chair"},
        {name:"Shoulder Taps", sets:"3 x 20", note:"Core and shoulder stability"}
      ],
      tip:"Move fast between exercises, rest only 30-45s. Should feel tough!"
    }
  },
  {
    day:"TUE", label:"Tuesday", type:"gym", color:"#FF6B35", title:"Upper Strength",
    subtitle:"Compound Upper Body / Power", tag:"GYM",
    exercises:[
      {name:"Barbell Row", sets:"4 x 6-8", note:"Heavy — pull to lower chest", weight:"40-50 kg"},
      {name:"Overhead Press", sets:"4 x 6-8", note:"Main press day — push the weight", weight:"25-35 kg"},
      {name:"Pull-ups / Lat Pulldown", sets:"4 x 6-8", note:"Add weight if bodyweight is easy", weight:"Bodyweight / 35-45 kg"},
      {name:"Dips", sets:"3 x 8-10", note:"Lean forward slightly for chest", weight:"Bodyweight"},
      {name:"DB Shrugs", sets:"3 x 12-15", note:"Trap builder — hold at top", weight:"18 kg each"}
    ],
    tip:"This is your second strength day — treat it as seriously as Monday. Heavy compounds first.",
    homegym:{title:"Home Gym Upper Strength", subtitle:"Bench · Dumbbells · Bioforce",
      exercises:[
        {name:"Bioforce Lat Pulldown", sets:"4 x 8-10", note:"Full stretch at top, squeeze at bottom", weight:"18-22 kg equiv"},
        {name:"DB Shoulder Press", sets:"4 x 8-10", note:"Seated, heavy", weight:"12-16 kg each"},
        {name:"Bioforce Seated Row", sets:"4 x 8-10", note:"Drive elbows back hard, pause at chest", weight:"18-22 kg equiv"},
        {name:"DB Incline Press", sets:"3 x 10-12", note:"Use the bench at incline angle", weight:"12-16 kg each"},
        {name:"DB Shrugs", sets:"3 x 12-15", note:"Hold at top for 1 second", weight:"Up to 18 kg each"}
      ],
      tip:"Focus on the Bioforce row and pulldown as your main movers. Push resistance up each week."
    },
    alt:{title:"30-Min Home Upper", subtitle:"No equipment",
      exercises:[
        {name:"Push-ups", sets:"4 x 15-20", note:"Vary grip each set"},
        {name:"Table Rows", sets:"4 x 12-15", note:"Lie under a table, pull chest to edge"},
        {name:"Pike Push-ups", sets:"3 x 12", note:"Shoulders and upper back"},
        {name:"Superman Hold", sets:"3 x 30s", note:"Lie face down, lift arms and legs"},
        {name:"Chair Dips", sets:"3 x 15", note:""}
      ],
      tip:"Superset push-ups and table rows back to back for max upper body pump."
    }
  },
  {
    day:"WED", label:"Wednesday", type:"gym", color:"#FF6B35", title:"Pull Day",
    subtitle:"Back / Biceps", tag:"GYM",
    exercises:[
      {name:"Pull-ups / Lat Pulldown", sets:"4 x 6-8", note:"Add weight if bodyweight is easy", weight:"Bodyweight / 40 kg"},
      {name:"Barbell Row", sets:"4 x 8-10", note:"", weight:"40-50 kg"},
      {name:"Seated Cable Row", sets:"3 x 10-12", note:"", weight:"30-40 kg"},
      {name:"Face Pulls", sets:"3 x 15", note:"Posture and shoulder health", weight:"10-15 kg"},
      {name:"Barbell Curl", sets:"3 x 10-12", note:"", weight:"20-25 kg"}
    ],
    tip:"Control the negative (lowering) phase on every rep — that's where growth happens.",
    homegym:{title:"Home Gym Pull", subtitle:"Dumbbells · Bioforce",
      exercises:[
        {name:"Bioforce Lat Pulldown", sets:"4 x 8-10", note:"Full stretch at top, squeeze at bottom", weight:"18-22 kg equiv"},
        {name:"Single-Arm DB Row", sets:"4 x 10-12 each", note:"Brace on the bench, pull to hip", weight:"Up to 18 kg"},
        {name:"Bioforce Seated Row", sets:"3 x 12", note:"Drive elbows back, pause at chest", weight:"18-22 kg equiv"},
        {name:"Bioforce Face Pulls", sets:"3 x 15", note:"Pull to forehead, external rotate", weight:"8-12 kg equiv"},
        {name:"DB Hammer Curl", sets:"3 x 12", note:"Neutral grip — hits brachialis too", weight:"10-16 kg each"}
      ],
      tip:"The Bioforce row and pulldown are your heaviest hitters here. Increase resistance as these feel easy — don't rush the tempo."
    },
    alt:{title:"30-Min Home Pull", subtitle:"No equipment",
      exercises:[
        {name:"Table Rows", sets:"4 x 12-15", note:"Lie under a table, pull chest to edge"},
        {name:"Superman Hold", sets:"3 x 30s", note:"Lie face down, lift arms and legs"},
        {name:"Reverse Snow Angels", sets:"3 x 15", note:"Face down, arms sweep up and back"},
        {name:"Towel Bicep Curls", sets:"3 x 15", note:"Step on a towel, curl it up"},
        {name:"Dead Hangs", sets:"3 x 30s", note:"If you have a bar or sturdy branch"}
      ],
      tip:"Pull days are harder at home — focus on slow reps and squeezing your back."
    }
  },
  {
    day:"THU", label:"Thursday", type:"rest", color:"#888888", title:"Rest Day",
    subtitle:"Recovery / Light Walk", tag:"REST",
    exercises:[
      {name:"Light walk", sets:"20-30 min", note:"Easy pace, outdoors if possible", weight:""},
      {name:"Box Breathing", sets:"5 min", note:"4s in / 4s hold / 4s out", weight:""},
      {name:"Mobility work", sets:"10 min", note:"Hip flexors, thoracic spine, shoulders", weight:""}
    ],
    tip:"Muscles grow on rest days. Keep it easy — today's job is recovery.",
    alt:{title:"Gym Bonus Day", subtitle:"Since you're there — keep it moderate",
      exercises:[
        {name:"Bench Press", sets:"3 x 8-10", note:"Lighter than Monday", weight:"35-45 kg"},
        {name:"Pull-ups or Lat Pulldown", sets:"3 x 8-10", note:"", weight:"Bodyweight / 35 kg"},
        {name:"Dumbbell Shoulder Press", sets:"3 x 10-12", note:"", weight:"10-14 kg each"},
        {name:"Plank", sets:"3 x 45s", note:"", weight:"Bodyweight"}
      ],
      tip:"Moderate intensity only — save energy for Friday legs."
    }
  },
  {
    day:"FRI", label:"Friday", type:"gym", color:"#FF6B35", title:"Legs + Core",
    subtitle:"Quads / Hamstrings / Abs", tag:"GYM",
    exercises:[
      {name:"Barbell Squat", sets:"4 x 6-8", note:"King of all lifts — go deep", weight:"50-65 kg"},
      {name:"Romanian Deadlift", sets:"4 x 8-10", note:"Hinge at hips, feel the stretch", weight:"40-55 kg"},
      {name:"Leg Press", sets:"3 x 10-12", note:"", weight:"60-80 kg"},
      {name:"Walking Lunges", sets:"3 x 12/leg", note:"", weight:"10-12 kg each"},
      {name:"Hanging Leg Raises", sets:"3 x 12-15", note:"Controlled — no swinging", weight:"Bodyweight"}
    ],
    tip:"Squat depth matters — aim for parallel or below. Record your squat PRs each week.",
    homegym:{title:"Home Gym Legs + Core", subtitle:"Dumbbells · Bioforce · Bench",
      exercises:[
        {name:"DB Goblet Squat", sets:"4 x 10-12", note:"Hold one DB at chest, hit depth", weight:"Up to 18 kg"},
        {name:"DB Romanian Deadlift", sets:"4 x 10-12", note:"Hinge at hips, slow eccentric", weight:"Two DBs, up to 18 kg each"},
        {name:"Bulgarian Split Squat", sets:"3 x 10/leg", note:"Back foot on bench", weight:"8-16 kg each hand"},
        {name:"DB Step-ups", sets:"3 x 12/leg", note:"Use the bench, controlled descent", weight:"8-14 kg each"},
        {name:"Bioforce Woodchop", sets:"3 x 12/side", note:"Rotate through core, not arms", weight:"8-12 kg equiv"},
        {name:"Plank", sets:"3 x 45-60s", note:"", weight:"Bodyweight"}
      ],
      tip:"Goblet squats with max DB weight are harder than they look. If depth suffers, drop the weight — range of motion wins."
    },
    alt:{title:"30-Min Home Legs", subtitle:"No equipment needed",
      exercises:[
        {name:"Jump Squats", sets:"4 x 15", note:"Land soft, explode up"},
        {name:"Bulgarian Split Squats", sets:"3 x 12/leg", note:"Back foot on chair"},
        {name:"Glute Bridges", sets:"3 x 20", note:"Squeeze at the top"},
        {name:"Wall Sit", sets:"3 x 45s", note:"Thighs parallel to floor"},
        {name:"Plank", sets:"3 x 45s", note:""},
        {name:"Bicycle Crunches", sets:"3 x 20", note:"Slow and controlled"}
      ],
      tip:"Jump squats are brutal — pace yourself on the first set."
    }
  },
  {
    day:"SAT", label:"Saturday", type:"gym", color:"#FF6B35", title:"Arms + Core",
    subtitle:"Biceps / Triceps / Abs", tag:"GYM",
    exercises:[
      {name:"Barbell Curl", sets:"4 x 8-10", note:"Full range — don't swing", weight:"20-25 kg"},
      {name:"Skull Crushers", sets:"4 x 8-10", note:"Keep elbows pointed up", weight:"15-20 kg"},
      {name:"Hammer Curls", sets:"3 x 10-12", note:"Neutral grip — hits brachialis", weight:"10-14 kg each"},
      {name:"Overhead Tricep Extension", sets:"3 x 10-12", note:"", weight:"15-20 kg"},
      {name:"Ab Wheel / Hanging Leg Raises", sets:"3 x 12-15", note:"Controlled — slow on the way down", weight:"Bodyweight"},
      {name:"Plank", sets:"3 x 60s", note:"Squeeze everything", weight:"Bodyweight"}
    ],
    tip:"Arms respond well to volume — keep rest short (60s) and focus on the squeeze. Great day to also do a 20-min easy walk after.",
    homegym:{title:"Home Gym Arms + Core", subtitle:"Dumbbells · Bioforce",
      exercises:[
        {name:"DB Curl", sets:"4 x 10-12", note:"Alternate arms, supinate at top", weight:"10-14 kg each"},
        {name:"Bioforce Tricep Pushdown", sets:"4 x 10-12", note:"Elbows pinned to sides, full extension", weight:"10-15 kg equiv"},
        {name:"DB Hammer Curl", sets:"3 x 12", note:"Neutral grip, no swinging", weight:"10-14 kg each"},
        {name:"Bioforce Overhead Tricep Ext", sets:"3 x 12", note:"Face away from anchor, elbows in", weight:"8-12 kg equiv"},
        {name:"Bioforce Woodchop", sets:"3 x 12/side", note:"Rotate through core", weight:"8-12 kg equiv"},
        {name:"Plank", sets:"3 x 60s", note:"", weight:"Bodyweight"}
      ],
      tip:"Bioforce is ideal for arm isolation. Keep rest to 60s and feel the burn — high volume is key for arms."
    },
    alt:{title:"30-Min Arms + Core", subtitle:"No equipment",
      exercises:[
        {name:"Diamond Push-ups", sets:"4 x 12-15", note:"Hands close together — major tricep hit"},
        {name:"Towel Bicep Curls", sets:"3 x 15", note:"Step on a towel, curl it up — feel the bicep"},
        {name:"Chair Dips", sets:"3 x 15", note:"Slow and controlled"},
        {name:"Plank", sets:"3 x 60s", note:""},
        {name:"Bicycle Crunches", sets:"3 x 20", note:"Slow — feel the rotation"},
        {name:"V-Sit Hold", sets:"3 x 30s", note:"Lean back, legs up, balance"}
      ],
      tip:"Towel curls sound easy — they aren't. Full range and slow tempo."
    }
  },
  {
    day:"SUN", label:"Sunday", type:"rest", color:"#888888", title:"Full Rest",
    subtitle:"Recovery / Recharge", tag:"REST",
    exercises:[
      {name:"Meal prep", sets:"Recommended", note:"Hit 150-160g protein/day", weight:""},
      {name:"Sleep 8h", sets:"Non-negotiable", note:"This is when you actually grow", weight:""},
      {name:"Light stretching", sets:"Optional 10 min", note:"Nothing intense", weight:""}
    ],
    tip:"Prep your meals today — protein is everything for muscle growth. Aim for 2.2g per kg bodyweight (about 130-140g daily)."
  }
];

var tagStyles = {
  GYM:  {bg:"#FF6B3522",border:"#FF6B3555",text:"#FF6B35"},
  RUN:  {bg:"#00D4FF22",border:"#00D4FF55",text:"#00D4FF"},
  REST: {bg:"#88888822",border:"#88888855",text:"#aaa"}
};

var HOME_COLOR = "#4ade80";
var ALT_COLOR  = "#a78bfa";

function buildRows(exercises, color) {
  return exercises.map(function(ex) {
    return '<div class="exercise-row">'
      + '<div style="display:flex;align-items:center;gap:10px;flex:1">'
      + '<div style="width:6px;height:6px;border-radius:50%;background:'+color+';flex-shrink:0"></div>'
      + '<div><div style="font-weight:600;font-size:14px;color:#ddd">'+ex.name+'</div>'
      + (ex.note ? '<div style="font-family:\'DM Mono\',monospace;font-size:11px;color:#444;margin-top:2px">'+ex.note+'</div>' : '')
      + '</div></div>'
      + '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">'
      + '<div class="sets-badge" style="color:'+color+';background:'+color+'15">'+ex.sets+'</div>'
      + (ex.weight ? '<div class="sets-badge" style="color:#aaa;background:#ffffff0a;font-size:11px">'+ex.weight+'</div>' : '')
      + '</div></div>';
  }).join('');
}

// ── TODAY DISPLAY ─────────────────────────────────────────
var dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var todayName = dayNames[new Date().getDay()];
var todayData = days.filter(function(d){return d.label===todayName;})[0] || days[0];

function renderToday() {
  var tc = document.getElementById('today-content');
  var d = todayData;
  var color = d.color;
  var hdr = '<div style="font-family:\'DM Mono\',monospace;font-size:11px;color:#555;letter-spacing:2px;margin-bottom:10px;">TODAY &middot; '+todayName.toUpperCase()+'</div>';

  tc.innerHTML = hdr
    + '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:14px;">'
    + '<div>'
    + '<div style="font-size:20px;font-weight:800;margin-bottom:2px">'+d.title+'</div>'
    + '<div style="font-family:\'DM Mono\',monospace;font-size:11px;color:'+color+'">'+d.subtitle+'</div>'
    + '</div>'
    + '</div>'
    + '<div style="margin-bottom:16px">'+buildRows(d.exercises, color)+'</div>'
    + '<div class="tip-box" style="background:'+color+'10;border:1px solid '+color+'25">'
    + '<span>&#128161;</span>'
    + '<div style="font-family:\'DM Mono\',monospace;font-size:12px;color:#777;line-height:1.6">'+d.tip+'</div>'
    + '</div>';
}

// ── WEEK CALENDAR ─────────────────────────────────────────
var selected = null;
var showMode = 'main';
var calendar = document.getElementById('calendar');
var panelContainer = document.getElementById('panel-container');

function renderCalendar() {
  calendar.innerHTML = '';
  days.forEach(function(d, i) {
    var ts = tagStyles[d.tag];
    var isActive = selected === i;
    var card = document.createElement('div');
    card.className = 'day-card' + (isActive ? ' active' : '');
    if (isActive) { card.style.background = d.color+'18'; card.style.borderColor = d.color; }
    card.innerHTML = (isActive ? '<div class="glow-bar" style="background:linear-gradient(90deg,transparent,'+d.color+',transparent)"></div>' : '')
      + '<div class="day-label" style="'+(isActive?'color:'+d.color:'')+'">'+d.day+'</div>'
      + '<div class="day-tag" style="background:'+ts.bg+';border:1px solid '+ts.border+';color:'+ts.text+'">'+d.tag+'</div>'
      + '<div style="font-size:20px">'+(d.type==='gym'?'&#127947;':d.type==='run'?'&#127939;':'&#128564;')+'</div>'
      + '<div class="day-name" style="'+(isActive?'color:#fff':'')+'">'+d.label+'</div>';
    card.addEventListener('click', function() {
      selected = isActive ? null : i;
      if (!isActive) showMode = 'main';
      renderCalendar();
      renderPanel();
    });
    calendar.appendChild(card);
  });
}

function renderPanel() {
  if (selected === null) {
    panelContainer.innerHTML = '<div class="empty-hint">tap a day to see your workout</div>';
    return;
  }
  var d = days[selected];
  var isHome = showMode==='home' && d.homegym;
  var isAlt  = showMode==='alt'  && d.alt;
  var view   = isHome ? d.homegym : isAlt ? d.alt : d;
  var color  = isHome ? HOME_COLOR : isAlt ? ALT_COLOR : d.color;

  function tabBtn(id, label, active, col) {
    return '<button id="'+id+'" style="font-family:\'DM Mono\',monospace;font-size:11px;padding:6px 14px;border-radius:8px;border:1px solid '+(active?col:'#333')+';background:'+(active?col+'22':'transparent')+';color:'+(active?col:'#555')+';cursor:pointer;letter-spacing:1px;">'+label+'</button>';
  }

  var tabs = tabBtn('tab-main','Main Plan', showMode==='main', d.color);
  if (d.homegym) tabs += tabBtn('tab-home', '🏠 Home Gym', showMode==='home', HOME_COLOR);
  if (d.alt)     tabs += tabBtn('tab-alt',  '30-Min Alt',  showMode==='alt',  ALT_COLOR);

  panelContainer.innerHTML = '<div class="panel visible" style="border:1.5px solid '+color+'40">'
    + '<div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,'+color+','+color+'33);border-radius:18px 18px 0 0"></div>'
    + '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">'
    + '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+tabs+'</div>'
    + '<button class="close-btn" id="close-panel">&#215;</button>'
    + '</div>'
    + '<div style="font-size:20px;font-weight:800;margin-bottom:3px">'+(view.title||d.title)+'</div>'
    + '<div style="font-family:\'DM Mono\',monospace;font-size:12px;color:#555;letter-spacing:1px;margin-bottom:14px">'+(view.subtitle||d.subtitle)+'</div>'
    + '<div style="margin-bottom:18px">'+buildRows(view.exercises, color)+'</div>'
    + '<div class="tip-box" style="background:'+color+'10;border:1px solid '+color+'25">'
    + '<span>&#128161;</span>'
    + '<div style="font-family:\'DM Mono\',monospace;font-size:12px;color:#777;line-height:1.6">'+(view.tip||d.tip)+'</div>'
    + '</div></div>';

  document.getElementById('close-panel').addEventListener('click', function(){selected=null;showMode='main';renderCalendar();renderPanel();});
  document.getElementById('tab-main').addEventListener('click', function(){showMode='main';renderPanel();});
  var hb = document.getElementById('tab-home');
  if (hb) hb.addEventListener('click', function(){showMode='home';renderPanel();});
  var ab = document.getElementById('tab-alt');
  if (ab) ab.addEventListener('click', function(){showMode='alt';renderPanel();});
}

renderToday();
renderCalendar();
renderPanel();
</script>

</body>
</html>
